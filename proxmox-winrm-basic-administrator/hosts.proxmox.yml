plugin: community.proxmox.proxmox
url: https://192.168.2.201:8006
user: root@pam
password: "{{ lookup('env', 'PROXMOX_PASSWORD')}}"
want_facts: true
validate_certs: false
# Note that this can easily give you wrong values as ansible_host. See further below for
# an example where this is set to `false` and where ansible_host is set with `compose`.
compose:
  # This takes the IP-address string (e.g., '192.168.2.211/24'), 
  # splits it at the '/', and takes the first part (the IP).
  ansible_host: proxmox_agent_interfaces | map(attribute='ip-addresses') | flatten | select('search', '^192\.168\.2\.') | first | split('/') | first
